[package]
name = "streamcam"
version = "1.0.0"
edition = "2021"
publish = false
description = "Camera controls for Logitech StreamCam"
license = "MIT"
authors = ["Andrea Amorosi"]
repository = "https://github.com/dreamorosi/streamcam-controls"
homepage = "https://github.com/dreamorosi/streamcam-controls"

[dependencies]
nusb = "=0.2.9"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
